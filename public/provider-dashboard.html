<!DOCTYPE html>
<html lang="en" class="bg-body">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Provider Dashboard · QuickServe</title>
  <meta name="description" content="Manage your QuickServe profile, incoming bookings and job pipeline." />
  <meta name="theme-color" content="#9F1239" />
  <link rel="icon" href="images/og-cover.png" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />
</head>
<body>
  <main>
    <div class="container-tight py-4">
      <div class="dash-hero mb-4" data-dash>
        <div class="row align-items-center g-3">
          <div class="col-md-7">
            <span class="eyebrow" style="color:#93c5fd">Provider dashboard</span>
            <h1 class="mt-2 mb-1" style="font-size:2rem" id="welcome">Welcome</h1>
            <p class="mb-0" style="color:#cbd5e1">Manage incoming requests and keep your profile sharp.</p>
          </div>
          <div class="col-md-5">
            <div class="row g-2">
              <div class="col-3"><div class="dash-stat text-center"><div class="num" id="statNew">0</div><div class="lbl">New</div></div></div>
              <div class="col-3"><div class="dash-stat text-center"><div class="num" id="statActive">0</div><div class="lbl">Active</div></div></div>
              <div class="col-3"><div class="dash-stat text-center"><div class="num" id="statDone">0</div><div class="lbl">Done</div></div></div>
              <div class="col-3"><div class="dash-stat text-center"><div class="num" id="statRating">0</div><div class="lbl">Rating</div></div></div>
            </div>
          </div>
        </div>
      </div>

      <div class="row g-4">
        <!-- Bookings -->
        <div class="col-lg-8">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
            <h5 class="fw-bold mb-0">Booking requests</h5>
            <div class="d-flex flex-wrap gap-2" id="filterTabs"></div>
          </div>
          <div id="bookingList" class="d-flex flex-column gap-3"></div>
        </div>

        <!-- Profile editor -->
        <div class="col-lg-4">
          <div class="surface p-4" style="position:sticky;top:90px" data-dash>
            <div class="d-flex align-items-center justify-content-between mb-3">
              <h5 class="fw-bold mb-0">Your profile</h5>
              <span class="status" id="pubStatus"></span>
            </div>
            <div class="text-center mb-3">
              <div class="position-relative d-inline-block">
                <img id="profilePreview" class="avatar-lg" alt="Profile photo" src="images/og-cover.png">
                <label class="btn btn-brand btn-sm position-absolute" style="right:-6px;bottom:-6px;border-radius:50%;width:38px;height:38px;padding:0;display:grid;place-items:center" title="Upload photo">
                  <i class="bi bi-camera"></i>
                  <input type="file" id="photoInput" accept="image/*" hidden>
                </label>
              </div>
              <div class="small text-muted-2 mt-2" id="uploadHint"></div>
            </div>
            <form id="profileForm">
              <div class="mb-2">
                <label class="form-label">Service category</label>
                <select class="form-select" name="category" id="categorySelect"></select>
              </div>
              <div class="row g-2">
                <div class="col-6 mb-2">
                  <label class="form-label">Rate ($/hr)</label>
                  <input class="form-control" name="price" type="number" min="1" />
                </div>
                <div class="col-6 mb-2">
                  <label class="form-label">Experience (yrs)</label>
                  <input class="form-control" name="experience" type="number" min="0" />
                </div>
              </div>
              <div class="mb-2">
                <label class="form-label">Location</label>
                <input class="form-control" name="location" placeholder="e.g. Downtown" />
              </div>
              <div class="mb-3">
                <label class="form-label">Bio</label>
                <textarea class="form-control" name="bio" rows="4" placeholder="Describe your services and expertise..."></textarea>
              </div>
              <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="publishSwitch" name="published">
                <label class="form-check-label" for="publishSwitch">Visible in marketplace</label>
              </div>
              <button class="btn btn-brand w-100" id="saveProfile" type="submit">
                <span class="label">Save profile</span>
                <span class="spinner-border spinner-border-sm ms-2 d-none"></span>
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script type="module" src="js/provider-dashboard.js"></script>
</body>
</html>
