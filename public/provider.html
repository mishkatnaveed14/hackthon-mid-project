<!DOCTYPE html>
<html lang="en" class="bg-body">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Provider · QuickServe</title>
  <meta name="description" content="View provider details, reviews and book a trusted local professional on QuickServe." />
  <meta name="theme-color" content="#9F1239" />
  <link rel="icon" href="images/og-cover.png" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />
</head>
<body>
  <main>
    <div class="container-tight py-4" id="providerRoot">
      <div class="surface p-4"><div class="skeleton" style="height:280px"></div></div>
    </div>
  </main>

  <!-- Booking modal -->
  <div class="modal fade" id="bookingModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border:none;border-radius:20px;overflow:hidden">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold">Request a booking</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body pt-0">
          <div class="d-flex align-items-center gap-2 mb-3 p-2 rounded" style="background:var(--brand-soft)">
            <img id="bmAvatar" class="avatar" alt="">
            <div><div class="fw-bold" id="bmName"></div><div class="small text-muted-2" id="bmCat"></div></div>
            <span class="ms-auto price-tag" id="bmPrice"></span>
          </div>
          <form id="bookingForm" novalidate>
            <div class="row g-3">
              <div class="col-6">
                <label class="form-label">Date</label>
                <input class="form-control" type="date" name="date" />
                <span class="field-error" data-error="date"></span>
              </div>
              <div class="col-6">
                <label class="form-label">Preferred time</label>
                <input class="form-control" type="time" name="time" />
                <span class="field-error" data-error="time"></span>
              </div>
              <div class="col-12">
                <label class="form-label">Service address</label>
                <input class="form-control" name="location" placeholder="Street, city" />
                <span class="field-error" data-error="location"></span>
              </div>
              <div class="col-12">
                <label class="form-label">Describe what you need</label>
                <textarea class="form-control" name="description" rows="3" placeholder="e.g. Kitchen sink is leaking under the cabinet..."></textarea>
                <span class="field-error" data-error="description"></span>
              </div>
            </div>
            <button class="btn btn-brand btn-lg w-100 mt-3" id="bookSubmit" type="submit">
              <span class="label">Send booking request</span>
              <span class="spinner-border spinner-border-sm ms-2 d-none"></span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script type="module" src="js/provider.js"></script>
</body>
</html>
