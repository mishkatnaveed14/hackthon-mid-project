<!DOCTYPE html>
<html lang="en" class="bg-body">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard · QuickServe</title>
  <meta name="description" content="Track your QuickServe bookings, view provider details and leave reviews." />
  <meta name="theme-color" content="#9F1239" />
  <link rel="icon" href="images/og-cover.png" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />
</head>
<body>
  <main>
    <div class="container-tight py-4">
      <div class="dash-hero mb-4" data-dash>
        <div class="row align-items-center g-3">
          <div class="col-md-7">
            <span class="eyebrow" style="color:#93c5fd">Customer dashboard</span>
            <h1 class="mt-2 mb-1" style="font-size:2rem" id="welcome">Welcome back</h1>
            <p class="mb-0" style="color:#cbd5e1">Manage your bookings and rate completed jobs.</p>
          </div>
          <div class="col-md-5">
            <div class="row g-2">
              <div class="col-4"><div class="dash-stat text-center"><div class="num" id="statTotal">0</div><div class="lbl">Total</div></div></div>
              <div class="col-4"><div class="dash-stat text-center"><div class="num" id="statActive">0</div><div class="lbl">Active</div></div></div>
              <div class="col-4"><div class="dash-stat text-center"><div class="num" id="statDone">0</div><div class="lbl">Done</div></div></div>
            </div>
          </div>
        </div>
      </div>

      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
        <div class="d-flex flex-wrap gap-2" id="filterTabs"></div>
        <a href="index.html#services" class="btn btn-brand btn-sm"><i class="bi bi-plus-lg me-1"></i>Book a new service</a>
      </div>

      <div id="bookingList" class="d-flex flex-column gap-3"></div>
    </div>
  </main>

  <!-- Review modal -->
  <div class="modal fade" id="reviewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border:none;border-radius:20px">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold">Rate your experience</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body pt-0 text-center">
          <p class="text-muted-2" id="reviewFor"></p>
          <div class="star-input justify-content-center mb-3" id="starInput">
            <i class="bi bi-star-fill" data-v="1"></i><i class="bi bi-star-fill" data-v="2"></i>
            <i class="bi bi-star-fill" data-v="3"></i><i class="bi bi-star-fill" data-v="4"></i>
            <i class="bi bi-star-fill" data-v="5"></i>
          </div>
          <textarea class="form-control mb-3" id="reviewComment" rows="3" placeholder="Tell others about your experience..."></textarea>
          <button class="btn btn-brand w-100" id="submitReview">Submit review</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
