<!DOCTYPE html>
<html lang="en" class="bg-body">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · QuickServe</title>
  <meta name="description" content="Log in or create your QuickServe account to book trusted local professionals or offer your services." />
  <meta name="theme-color" content="#9F1239" />
  <link rel="icon" href="images/og-cover.png" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />
</head>
<body>
  <main class="auth-wrap">
    <div class="surface auth-card" data-auth-card>
      <div class="text-center mb-4">
        <a class="brand-logo justify-content-center mb-3 d-inline-flex" href="./index.html"><span class="mark"><i class="bi bi-tools"></i></span> QuickServe</a>
        <h3 class="fw-bold mb-1" id="authTitle">Welcome back</h3>
        <p class="text-muted-2 mb-0" id="authSub">Log in to manage your bookings.</p>
      </div>

      <div class="role-toggle mb-4" id="roleToggle" hidden>
        <button type="button" data-role="customer" class="active"><i class="bi bi-person me-1"></i>I need a service</button>
        <button type="button" data-role="provider"><i class="bi bi-briefcase me-1"></i>I'm a provider</button>
      </div>

      <form id="authForm" novalidate>
        <div id="nameField" hidden>
          <label class="form-label">Full name</label>
          <input class="form-control" name="name" placeholder="Jane Doe" />
          <span class="field-error" data-error="name"></span>
        </div>
        <div>
          <label class="form-label">Email address</label>
          <input class="form-control" name="email" type="email" placeholder="you@email.com" />
          <span class="field-error" data-error="email"></span>
        </div>
        <div>
          <label class="form-label">Password</label>
          <div class="position-relative">
            <input class="form-control" name="password" type="password" placeholder="••••••••" />
            <button type="button" class="btn btn-ghost btn-sm position-absolute" id="togglePw" style="right:4px;top:50%;transform:translateY(-50%)"><i class="bi bi-eye"></i></button>
          </div>
          <span class="field-error" data-error="password"></span>
        </div>
        <div id="phoneField" hidden>
          <label class="form-label">Phone <span class="text-muted-2 fw-normal">(optional)</span></label>
          <input class="form-control" name="phone" placeholder="+1 555 000 0000" />
        </div>

        <button class="btn btn-brand btn-lg w-100 mt-2" id="submitBtn" type="submit">
          <span class="label">Log in</span>
          <span class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
        </button>
      </form>

      <p class="text-center text-muted-2 mt-4 mb-0">
        <span id="switchText">New to QuickServe?</span>
        <a href="#" id="switchMode" class="fw-semibold">Create an account</a>
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
