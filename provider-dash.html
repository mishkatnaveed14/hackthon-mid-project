<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Provider Dashboard - QuickServe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold">Provider Service Management</h3>
      <a href="index.html" class="btn btn-outline-secondary btn-sm">Home</a>
    </div>

    <div class="card border-0 shadow-sm p-3">
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>Booking ID</th>
              <th>Customer</th>
              <th>Date & Time</th>
              <th>Location</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="bookingsTable">
            <tr><td colspan="6" class="text-center">Loading requests...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { db, auth } from './firebase-config.js';
    import { collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    onAuthStateChanged(auth, (user) => {
      if (!user) { window.location.href = "login.html"; } 
      else { fetchProviderBookings(user.uid); }
    });

    async function fetchProviderBookings(providerUid) {
      const q = query(collection(db, "bookings"), where("providerId", "==", providerUid));
      const snapshot = await getDocs(q);
      const tbody = document.getElementById('bookingsTable');

      if (snapshot.empty) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">No incoming service requests.</td></tr>`;
        return;
      }

      let rows = '';
      snapshot.forEach((docSnap) => {
        const b = docSnap.data();
        const docId = docSnap.id;

        rows += `
          <tr>
            <td><strong class="text-primary">${b.bookingId}</strong></td>
            <td>${b.customerEmail}</td>
            <td>${b.date} at ${b.time}</td>
            <td>${b.location}</td>
            <td>${getStatusBadge(b.status)}</td>
            <td>${renderActionButtons(docId, b.status)}</td>
          </tr>
        `;
      });
      tbody.innerHTML = rows;
      attachEventListeners();
    }

    function getStatusBadge(status) {
      const colors = {
        'Pending': 'bg-warning text-dark',
        'Accepted': 'bg-info text-dark',
        'In Progress': 'bg-primary',
        'Completed': 'bg-success',
        'Rejected': 'bg-danger'
      };
      return `<span class="badge ${colors[status] || 'bg-secondary'}">${status}</span>`;
    }

    // Business Rules Enforced Actions
    function renderActionButtons(docId, status) {
      if (status === 'Pending') {
        return `
          <button class="btn btn-sm btn-success action-btn" data-id="${docId}" data-target="Accepted">Accept</button>
          <button class="btn btn-sm btn-outline-danger action-btn" data-id="${docId}" data-target="Rejected">Reject</button>
        `;
      } else if (status === 'Accepted') {
        return `<button class="btn btn-sm btn-primary action-btn" data-id="${docId}" data-target="In Progress">Start Work</button>`;
      } else if (status === 'In Progress') {
        return `<button class="btn btn-sm btn-success action-btn" data-id="${docId}" data-target="Completed">Mark Completed</button>`;
      } else {
        return `<span class="text-muted small">No further action</span>`;
      }
    }

    function attachEventListeners() {
      document.querySelectorAll('.action-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const docId = e.target.getAttribute('data-id');
          const nextStatus = e.target.getAttribute('data-target');
          
          try {
            await updateDoc(doc(db, "bookings", docId), { status: nextStatus });
            fetchProviderBookings(auth.currentUser.uid);
          } catch(err) {
            console.error("Status update error:", err);
          }
        });
      });
    }
  </script>
</body>
</html>
