<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Provider Dashboard - QuickServe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark py-3">
    <div class="container">
      <a class="navbar-brand brand-logo fs-3" href="index.html">QuickServe</a>
      <div id="navActions"></div>
    </div>
  </nav>

  <div class="container my-5">
    <h3 class="fw-bold mb-4">Incoming Booking Demands</h3>

    <div class="card border-0 shadow-sm rounded-4 p-4">
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>Booking ID</th>
              <th>Customer Email</th>
              <th>Schedule</th>
              <th>Address</th>
              <th>Status</th>
              <th>Action Workflow</th>
            </tr>
          </thead>
          <tbody id="providerBookingsTable">
            <tr><td colspan="6" class="text-center py-4">Loading requests...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
  <script type="module">
    import { getAllData, updateData } from './firebase.js';

    async function loadProviderBookings() {
      const user = JSON.parse(localStorage.getItem("user"));
      const res = await getAllData("bookings");
      const tbody = document.getElementById("providerBookingsTable");

      if (!res.success) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger">Error loading data.</td></tr>`;
        return;
      }

      // Shows incoming requests for active provider session
      const myBookings = res.data;

      if (myBookings.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">No active booking requests found.</td></tr>`;
        return;
      }

      tbody.innerHTML = myBookings.map(b => `
        <tr>
          <td><strong class="text-primary">${b.bookingId}</strong></td>
          <td>${b.customerEmail}</td>
          <td>${b.date} (${b.time})</td>
          <td>${b.location}</td>
          <td><span class="status-badge status-${b.status.replace(/\s+/g, '-')}">${b.status}</span></td>
          <td>${renderWorkflowControls(b.id, b.status)}</td>
        </tr>
      `).join('');

      attachActionListeners();
    }

    // Business Rules for Status State Machine
    function renderWorkflowControls(docId, status) {
      if (status === "Pending") {
        return `
          <button class="btn btn-sm btn-success status-btn me-1" data-id="${docId}" data-status="Accepted">Accept</button>
          <button class="btn btn-sm btn-outline-danger status-btn" data-id="${docId}" data-status="Rejected">Reject</button>
        `;
      } else if (status === "Accepted") {
        return `<button class="btn btn-sm btn-primary status-btn" data-id="${docId}" data-status="In Progress">Start Work (In Progress)</button>`;
      } else if (status === "In Progress") {
        return `<button class="btn btn-sm btn-success status-btn" data-id="${docId}" data-status="Completed">Mark Completed</button>`;
      } else if (status === "Rejected") {
        return `<span class="text-danger small fw-semibold">Booking Rejected</span>`;
      } else {
        return `<span class="text-muted small fw-semibold">Completed / Locked</span>`;
      }
    }

    function attachActionListeners() {
      document.querySelectorAll(".status-btn").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          const docId = e.target.getAttribute("data-id");
          const nextStatus = e.target.getAttribute("data-status");

          await updateData("bookings", docId, { status: nextStatus });
          loadProviderBookings();
        });
      });
    }

    loadProviderBookings();
  </script>
</body>
</html>
