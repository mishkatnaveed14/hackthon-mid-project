<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Customer Dashboard - QuickServe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold">My Service Bookings</h3>
      <a href="index.html" class="btn btn-outline-secondary btn-sm">Home</a>
    </div>

    <div class="row g-3" id="customerBookings">
      <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
    </div>
  </div>

  <!-- Review Modal -->
  <div class="modal fade" id="reviewModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Rate Service</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="reviewForm">
            <input type="hidden" id="modalBookingDocId">
            <div class="mb-3">
              <label class="form-label">Rating (1 to 5 Stars)</label>
              <select id="ratingSelect" class="form-select" required>
                <option value="5">5 ★★★★★ (Excellent)</option>
                <option value="4">4 ★★★★☆ (Good)</option>
                <option value="3">3 ★★★☆☆ (Average)</option>
                <option value="2">2 ★★☆☆☆ (Poor)</option>
                <option value="1">1 ★☆☆☆☆ (Terrible)</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Comments</label>
              <textarea id="commentInput" class="form-control" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Submit Review</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { db, auth } from './firebase-config.js';
    import { collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    let modalInstance = null;

    onAuthStateChanged(auth, (user) => {
      if (!user) { window.location.href = "login.html"; } 
      else { 
        modalInstance = new bootstrap.Modal(document.getElementById('reviewModal'));
        fetchCustomerBookings(user.uid); 
      }
    });

    async function fetchCustomerBookings(customerUid) {
      const q = query(collection(db, "bookings"), where("customerId", "==", customerUid));
      const snapshot = await getDocs(q);
      const container = document.getElementById('customerBookings');

      if (snapshot.empty) {
        container.innerHTML = `<div class="col-12 text-center text-muted py-4"><p>No bookings found.</p></div>`;
        return;
      }

      container.innerHTML = snapshot.docs.map(docSnap => {
        const b = docSnap.data();
        const id = docSnap.id;
        const canReview = b.status === 'Completed' && b.review === null;
        
        return `
          <div class="col-md-6">
            <div class="card border-0 shadow-sm p-3">
              <div class="d-flex justify-content-between">
                <h5 class="fw-bold">${b.serviceCategory}</h5>
                <span class="badge ${getBadgeClass(b.status)}">${b.status}</span>
              </div>
              <p class="text-muted small mb-1">Booking ID: <strong>${b.bookingId}</strong></p>
              <p class="text-muted small mb-1">Provider: ${b.providerName}</p>
              <p class="text-muted small mb-2">Scheduled: ${b.date} (${b.time})</p>
              
              <div class="mt-2 pt-2 border-top">
                ${b.review ? 
                  `<div class="text-success small">✔ Review Submitted: ${b.review.rating}★ "${b.review.comment}"</div>` : 
                  (canReview ? 
                    `<button class="btn btn-sm btn-outline-primary open-review-btn" data-id="${id}">Write a Review</button>` : 
                    `<span class="text-muted small">${b.status === 'Completed' ? 'Already Reviewed' : 'Review available after completion'}</span>`)
                }
              </div>
            </div>
          </div>
        `;
      }).join('');

      document.querySelectorAll('.open-review-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.getElementById('modalBookingDocId').value = e.target.getAttribute('data-id');
          modalInstance.show();
        });
      });
    }

    function getBadgeClass(status) {
      if (status === 'Completed') return 'bg-success';
      if (status === 'Rejected') return 'bg-danger';
      if (status === 'In Progress') return 'bg-primary';
      if (status === 'Accepted') return 'bg-info text-dark';
      return 'bg-warning text-dark';
    }

    document.getElementById('reviewForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const docId = document.getElementById('modalBookingDocId').value;
      const rating = Number(document.getElementById('ratingSelect').value);
      const comment = document.getElementById('commentInput').value;

      try {
        await updateDoc(doc(db, "bookings", docId), {
          review: { rating, comment, createdAt: new Date().toISOString() }
        });
        modalInstance.hide();
        fetchCustomerBookings(auth.currentUser.uid);
      } catch (err) {
        console.error("Review submission error:", err);
      }
    });
  </script>
</body>
</html>
