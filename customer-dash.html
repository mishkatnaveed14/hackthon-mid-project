<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Customer Dashboard - QuickServe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark py-3">
    <div class="container">
      <a class="navbar-brand brand-logo fs-3" href="index.html">QuickServe</a>
      <div id="navActions"></div>
    </div>
  </nav>

  <div class="container my-5">
    <h3 class="fw-bold mb-4">My Bookings Track</h3>
    <div class="row g-4" id="customerBookingsList">
      <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
    </div>
  </div>

  <!-- Modal for Star Review -->
  <div class="modal fade" id="reviewModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content rounded-4 border-0">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold">Rate & Review Service</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="reviewForm">
            <input type="hidden" id="modalDocId">
            <div class="mb-3">
              <label class="form-label fw-semibold">Rating (1 to 5 Stars)</label>
              <select id="ratingSelect" class="form-select" required>
                <option value="5">5 ★★★★★ (Excellent)</option>
                <option value="4">4 ★★★★☆ (Good)</option>
                <option value="3">3 ★★★☆☆ (Average)</option>
                <option value="2">2 ★★☆☆☆ (Poor)</option>
                <option value="1">1 ★☆☆☆☆ (Terrible)</option>
              </select>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Review Comment</label>
              <textarea id="commentInput" class="form-control" rows="3" placeholder="Share your experience..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary-custom w-100 py-2">Submit Official Review</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module">
    import { getAllData, updateData } from './firebase.js';

    let bsModal = null;

    async function loadCustomerBookings() {
      const user = JSON.parse(localStorage.getItem("user"));
      const res = await getAllData("bookings");
      const container = document.getElementById("customerBookingsList");

      if (!res.success) {
        container.innerHTML = `<div class="col-12 text-center text-danger">Failed to fetch data.</div>`;
        return;
      }

      const myBookings = res.data.filter(b => b.customerId === user?.uid);

      if (myBookings.length === 0) {
        container.innerHTML = `<div class="col-12 text-center text-muted py-5">No bookings found.</div>`;
        return;
      }

      container.innerHTML = myBookings.map(b => {
        const isCompleted = b.status === "Completed";
        const hasReviewed = b.review !== null && b.review !== undefined;

        return `
          <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4 p-4 h-100 d-flex flex-column justify-content-between">
              <div>
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <span class="fw-bold text-primary">${b.bookingId}</span>
                  <span class="status-badge status-${b.status.replace(/\s+/g, '-')}">${b.status}</span>
                </div>
                <h4 class="fw-bold mb-1">${b.serviceCategory}</h4>
                <p class="text-muted small mb-1">Provider: <strong>${b.providerName}</strong></p>
                <p class="text-muted small mb-2">Schedule: ${b.date} at ${b.time}</p>
                <p class="bg-light p-2 rounded small text-dark mb-3">"${b.description}"</p>
              </div>
              <div class="pt-3 border-top">
                ${hasReviewed ? 
                  `<div class="text-success small fw-semibold">✔ Reviewed: ${b.review.rating}★ "${b.review.comment}"</div>` : 
                  (isCompleted ? 
                    `<button class="btn btn-outline-primary btn-sm open-modal-btn w-100" data-id="${b.id}">Submit 1-5 Star Review</button>` : 
                    `<span class="text-muted small d-block text-center">Review option unlocks once booking is marked Completed</span>`)
                }
              </div>
            </div>
          </div>
        `;
      }).join('');

      attachModalListeners();
    }

    function attachModalListeners() {
      bsModal = new bootstrap.Modal(document.getElementById("reviewModal"));
      document.querySelectorAll(".open-modal-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          document.getElementById("modalDocId").value = e.target.getAttribute("data-id");
          bsModal.show();
        });
      });
    }

    document.getElementById("reviewForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const docId = document.getElementById("modalDocId").value;
      const rating = Number(document.getElementById("ratingSelect").value);
      const comment = document.getElementById("commentInput").value;

      await updateData("bookings", docId, {
        review: { rating, comment, timestamp: new Date().toISOString() }
      });

      bsModal.hide();
      loadCustomerBookings();
    });

    loadCustomerBookings();
  </script>
</body>
</html>
