<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authentication Portal</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 14px;
      --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-gradient);
      padding: 1.5rem;
    }

    .auth-card {
      background: var(--surface);
      width: 100%;
      max-width: 440px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2.5rem 2rem;
      position: relative;
      overflow: hidden;
    }

    /* Tabs Toggle Header */
    .tab-header {
      display: flex;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 2rem;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .tab-btn.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    /* Forms Layout */
    .form-container {
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }

    .form-container.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .form-header h2 {
      font-size: 1.5rem;
      color: var(--text-main);
      font-weight: 700;
    }

    .form-header p {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Social Sign-In Buttons */
    .social-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 1.5rem;
    }

    .btn-social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #ffffff;
      color: var(--text-main);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn-social:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .btn-social i {
      font-size: 1.1rem;
    }

    .btn-google i { color: #ea4335; }
    .btn-facebook i { color: #1877f2; }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
    }

    .divider span {
      padding: 0 10px;
    }

    /* Input Controls */
    .input-group {
      margin-bottom: 1.2rem;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 1rem;
    }

    .input-control {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }

    /* Actions & Links */
    .form-actions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 1.2rem;
    }

    .link-forgot {
      color: var(--primary);
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
    }

    .link-forgot:hover {
      text-decoration: underline;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    /* Response Alert Box */
    .alert-box {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }

    .alert-box.error {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }

    .alert-box.success {
      background: #f0fdf4;
      color: #16a34a;
      border: 1px solid #bbf7d0;
    }

    /* Responsive adjustment */
    @media (max-width: 480px) {
      .auth-card {
        padding: 1.8rem 1.2rem;
      }
      .social-group {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <!-- Toggle Header -->
    <div class="tab-header">
      <button class="tab-btn active" id="tabSignIn">Sign In</button>
      <button class="tab-btn" id="tabSignUp">Sign Up</button>
    </div>

    <!-- Alert Message Display -->
    <div id="alertBox" class="alert-box"></div>

    <!-- Social Auth Bar (Common for both) -->
    <div class="social-group">
      <button class="btn-social btn-google" id="btnGoogle">
        <i class="fa-brands fa-google"></i> Google
      </button>
      <button class="btn-social btn-facebook" id="btnFacebook">
        <i class="fa-brands fa-facebook-f"></i> Facebook
      </button>
    </div>

    <div class="divider">
      <span>Or continue with email</span>
    </div>

    <!-- ================= SIGN IN FORM ================= -->
    <div class="form-container active" id="signInFormContainer">
      <div class="form-header">
        <h2>Welcome Back</h2>
        <p>Enter your credentials to access your account</p>
      </div>
      <form id="signInForm">
        <div class="input-group">
          <label for="loginEmail">Email Address</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="loginEmail" class="input-control" placeholder="name@example.com" required />
          </div>
        </div>
        <div class="input-group">
          <label for="loginPassword">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="loginPassword" class="input-control" placeholder="••••••••" required />
          </div>
        </div>
        <div class="form-actions">
          <a href="#" id="linkForgot" class="link-forgot">Forgot Password?</a>
        </div>
        <button type="submit" class="btn-submit" id="btnSignInSubmit">
          <span>Sign In</span> <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>
    </div>

    <!-- ================= SIGN UP FORM ================= -->
    <div class="form-container" id="signUpFormContainer">
      <div class="form-header">
        <h2>Create Account</h2>
        <p>Get started with your free account today</p>
      </div>
      <form id="signUpForm">
        <div class="input-group">
          <label for="regName">Full Name</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-user"></i>
            <input type="text" id="regName" class="input-control" placeholder="John Doe" required />
          </div>
        </div>
        <div class="input-group">
          <label for="regEmail">Email Address</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="regEmail" class="input-control" placeholder="name@example.com" required />
          </div>
        </div>
        <div class="input-group">
          <label for="regContact">Contact Number</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-phone"></i>
            <input type="text" id="regContact" class="input-control" placeholder="+92 300 1234567" />
          </div>
        </div>
        <div class="input-group">
          <label for="regPassword">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="regPassword" class="input-control" placeholder="••••••••" required />
          </div>
        </div>
        <button type="submit" class="btn-submit" id="btnSignUpSubmit">
          <span>Create Account</span> <i class="fa-solid fa-user-plus"></i>
        </button>
      </form>
    </div>

  </div>

  <!-- Firebase Services Modular Script Integration -->
  <script type="module">
    import { 
      registerUser, 
      loginUser, 
      loginWithGoogle, 
      loginWithFacebook, 
      resetPassword, 
      initAuthGuard 
    } from "./firebase.js";

    // DOM Selectors
    const tabSignIn = document.getElementById("tabSignIn");
    const tabSignUp = document.getElementById("tabSignUp");
    const signInContainer = document.getElementById("signInFormContainer");
    const signUpContainer = document.getElementById("signUpFormContainer");
    const alertBox = document.getElementById("alertBox");

    // Helper: Show Alert Feedback
    const showAlert = (message, type = "error") => {
      alertBox.className = `alert-box ${type}`;
      alertBox.textContent = message;
      alertBox.style.display = "block";
    };

    const clearAlert = () => {
      alertBox.style.display = "none";
      alertBox.textContent = "";
    };

    // Tab Toggle Handlers
    tabSignIn.addEventListener("click", () => {
      clearAlert();
      tabSignIn.classList.add("active");
      tabSignUp.classList.remove("active");
      signInContainer.classList.add("active");
      signUpContainer.classList.remove("active");
    });

    tabSignUp.addEventListener("click", () => {
      clearAlert();
      tabSignUp.classList.add("active");
      tabSignIn.classList.remove("active");
      signUpContainer.classList.add("active");
      signInContainer.classList.remove("active");
    });

    // --- Sign In Handler ---
    document.getElementById("signInForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearAlert();

      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      const res = await loginUser(email, password);
      if (res.success) {
        showAlert("Login successful! Redirecting...", "success");
        setTimeout(() => window.location.replace("/"), 1200);
      } else {
        showAlert(res.error, "error");
      }
    });

    // --- Sign Up Handler ---
    document.getElementById("signUpForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearAlert();

      const name = document.getElementById("regName").value;
      const email = document.getElementById("regEmail").value;
      const contact = document.getElementById("regContact").value;
      const password = document.getElementById("regPassword").value;

      const res = await registerUser(email, password, { name, contact });
      if (res.success) {
        showAlert(res.message, "success");
        document.getElementById("signUpForm").reset();
      } else {
        showAlert(res.error, "error");
      }
    });

    // --- Social Logins ---
    document.getElementById("btnGoogle").addEventListener("click", async () => {
      clearAlert();
      const res = await loginWithGoogle();
      if (res.success) window.location.replace("/");
      else showAlert(res.error, "error");
    });

    document.getElementById("btnFacebook").addEventListener("click", async () => {
      clearAlert();
      const res = await loginWithFacebook();
      if (res.success) window.location.replace("/");
      else showAlert(res.error, "error");
    });

    // --- Forgot Password ---
    document.getElementById("linkForgot").addEventListener("click", async (e) => {
      e.preventDefault();
      clearAlert();

      const email = document.getElementById("loginEmail").value;
      if (!email) {
        showAlert("Please enter your email address first.", "error");
        return;
      }

      const res = await resetPassword(email);
      if (res.success) showAlert(res.message, "success");
      else showAlert(res.error, "error");
    });

    // Initialize Auth Listener & Route Check
    initAuthGuard({
      onUserLoaded: (user) => {
        if (user && window.location.pathname.includes("auth.html")) {
          window.location.replace("/");
        }
      }
    });
  </script>
</body>
</html>
