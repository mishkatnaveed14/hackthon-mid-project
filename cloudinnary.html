<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Cloudinary Image Upload</title>
</head>

<body>
    <h3>Upload Image to Cloudinary</h3>
    <input type="file" id="imageInput" accept="image/*" />
    <button id="uploadBtn">Upload</button>

    <br /><br />
    <div id="result">
        <p>Uploaded Image Preview:</p>
        <img id="previewImg" src="" alt="Preview will appear here" style="max-width: 300px; display: none;" />
    </div>

    <script>
        const cloudName = "mlazbr7f"; // Apna Cloud Name yahan dalein
        const uploadPreset = "my_preset"; // Apna Unsigned Preset yahan dalein

        const uploadBtn = document.getElementById("uploadBtn");
        const imageInput = document.getElementById("imageInput");
        const previewImg = document.getElementById("previewImg");

        const uploadToCloudinary = async (file) => {
            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", uploadPreset);

            try {
                uploadBtn.innerText = "Uploading...";
                uploadBtn.disabled = true;

                const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
                    method: "POST",
                    body: formData,
                });

                const data = await response.json();

                if (data.secure_url) {
                    console.log("Uploaded Image URL:", data.secure_url);
                    // Image URL mil gaya! Ab is URL ko Firestore me save kar sakte hain.
                    previewImg.src = data.secure_url;
                    previewImg.style.display = "block";
                    alert("Image Uploaded Successfully!");
                } else {
                    alert("Upload failed: " + data.error.message);
                }
            } catch (error) {
                console.error("Error uploading image:", error);
                alert("Upload failed!");
            } finally {
                uploadBtn.innerText = "Upload";
                uploadBtn.disabled = false;
            }
        };

        uploadBtn.addEventListener("click", () => {
            const file = imageInput.files[0];
            if (!file) {
                alert("Please select a file first!");
                return;
            }
            uploadToCloudinary(file);
        });
