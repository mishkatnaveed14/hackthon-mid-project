<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickServe - Discover Local Service Providers</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">QuickServe</a>
      <div class="d-flex align-items-center gap-2" id="nav-actions">
        <a href="login.html" class="btn btn-outline-light btn-sm">Login / Register</a>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="row mb-4">
      <div class="col-md-8">
        <input type="text" id="searchInput" class="form-control" placeholder="Search by provider name or location...">
      </div>
      <div class="col-md-4">
        <select id="categoryFilter" class="form-select">
          <option value="ALL">All Categories</option>
          <option value="Plumbing">Plumbing</option>
          <option value="Electrical">Electrical</option>
          <option value="Cleaning">Cleaning</option>
          <option value="AC Repair">AC Repair</option>
          <option value="Painting">Painting</option>
        </select>
      </div>
    </div>

    <div class="row g-4" id="providersGrid">
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { db, auth } from './firebase-config.js';
    import { collection, getDocs, query } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    let providersData = [];

    // Check Auth State for Navbar
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('nav-actions').innerHTML = `
          <a href="customer-dash.html" class="btn btn-sm btn-outline-light">Customer Dashboard</a>
          <a href="provider-dash.html" class="btn btn-sm btn-outline-warning">Provider Dashboard</a>
        `;
      }
    });

    async function loadProviders() {
      try {
        const querySnapshot = await getDocs(collection(db, "providers"));
        providersData = [];
        querySnapshot.forEach((doc) => {
          providersData.push({ id: doc.id, ...doc.data() });
        });
        renderProviders(providersData);
      } catch (err) {
        console.error("Error fetching providers:", err);
      }
    }

    function renderProviders(list) {
      const grid = document.getElementById('providersGrid');
      if (list.length === 0) {
        grid.innerHTML = `<div class="col-12 text-center py-4"><p class="text-muted">No service providers found.</p></div>`;
        return;
      }
      grid.innerHTML = list.map(p => `
        <div class="col-md-4">
          <div class="card h-100 shadow-sm border-0">
            <div class="card-body d-flex flex-column">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <h5 class="card-title fw-bold mb-0">${p.name}</h5>
                <span class="badge bg-primary">${p.category}</span>
              </div>
              <p class="text-muted small mb-2">📍 ${p.location} • 💼 ${p.experience} Exp</p>
              <div class="mt-auto pt-3 border-top d-flex justify-content-between align-items-center">
                <div>
                  <span class="fw-bold text-dark">Rs. ${p.price}</span>
                  <div class="text-warning small">★ ${p.rating ? p.rating.toFixed(1) : 'New'} (${p.totalReviews || 0})</div>
                </div>
                <a href="provider-details.html?id=${p.id}" class="btn btn-sm btn-dark">View Details</a>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Dynamic Filter & Search Handlers
    document.getElementById('searchInput').addEventListener('input', filterData);
    document.getElementById('categoryFilter').addEventListener('change', filterData);

    function filterData() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const cat = document.getElementById('categoryFilter').value;

      const filtered = providersData.filter(p => {
        const matchesSearch = p.name.toLowerCase().includes(search) || p.location.toLowerCase().includes(search);
        const matchesCategory = cat === 'ALL' || p.category === cat;
        return matchesSearch && matchesCategory;
      });
      renderProviders(filtered);
    }

    loadProviders();
  </script>
</body>
</html>
