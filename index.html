<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickServe - Discover Local Experts</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark py-3">
    <div class="container">
      <a class="navbar-brand brand-logo fs-3" href="index.html">QuickServe</a>
      <div id="navActions" class="d-flex align-items-center"></div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="text-center mb-5">
      <h1 class="fw-extrabold display-5">Find Trusted Local Service Experts</h1>
      <p class="text-muted fs-5">Browse, book, track, and review verified service professionals.</p>
    </div>

    <!-- Search & Filter Controls -->
    <div class="card border-0 shadow-sm p-3 mb-5 rounded-4">
      <div class="row g-3">
        <div class="col-md-8">
          <input type="text" id="searchInput" class="form-control" placeholder="Search by provider name or location...">
        </div>
        <div class="col-md-4">
          <select id="categoryFilter" class="form-select">
            <option value="ALL">All Categories</option>
            <option value="Plumbing">Plumbing</option>
            <option value="Electrical">Electrical</option>
            <option value="Cleaning">Cleaning</option>
            <option value="AC Repair">AC Repair</option>
            <option value="Painting">Painting</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Dynamic Providers Grid (Minimum 6 Cards Mandatory) -->
    <div class="row g-4" id="providersGrid">
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
  <script type="module">
    import { getAllData, createData } from './firebase.js';

    let allProviders = [];

    async function initProviders() {
      let res = await getAllData("providers");
      
      // Auto-Seed minimum 6 service providers if DB is empty
      if (!res.success || res.data.length === 0) {
        const defaultProviders = [
          { name: "Ali Electrical Works", category: "Electrical", location: "Karachi", experience: "5 Years", price: 1500, rating: 4.8 },
          { name: "Ahmed Plumbing Expert", category: "Plumbing", location: "Lahore", experience: "3 Years", price: 1200, rating: 4.5 },
          { name: "CleanSpace Home Care", category: "Cleaning", location: "Islamabad", experience: "4 Years", price: 2500, rating: 4.9 },
          { name: "Cooling Tech AC Repair", category: "AC Repair", location: "Karachi", experience: "6 Years", price: 2000, rating: 4.7 },
          { name: "Master Paint Solutions", category: "Painting", location: "Rawalpindi", experience: "8 Years", price: 5000, rating: 4.6 },
          { name: "Rapid Fix Plumbers", category: "Plumbing", location: "Karachi", experience: "2 Years", price: 1000, rating: 4.3 }
        ];

        for (const p of defaultProviders) {
          await createData("providers", null, p);
        }
        res = await getAllData("providers");
      }

      allProviders = res.data || [];
      renderGrid(allProviders);
    }

    function renderGrid(list) {
      const grid = document.getElementById("providersGrid");
      if (list.length === 0) {
        grid.innerHTML = `<div class="col-12 text-center text-muted py-5">No service providers match your search filter.</div>`;
        return;
      }

      grid.innerHTML = list.map(p => `
        <div class="col-md-4">
          <div class="provider-card p-4 h-100 d-flex flex-column justify-content-between">
            <div>
              <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="badge-category">${p.category}</span>
                <span class="fw-bold text-warning">★ ${p.rating || '5.0'}</span>
              </div>
              <h4 class="fw-bold mb-2">${p.name}</h4>
              <p class="text-muted mb-1 small">📍 Location: <strong>${p.location}</strong></p>
              <p class="text-muted mb-3 small">💼 Experience: <strong>${p.experience}</strong></p>
            </div>
            <div class="pt-3 border-top d-flex justify-content-between align-items-center">
              <div>
                <span class="text-muted small d-block">Starting Rate</span>
                <span class="fs-5 fw-bold text-dark">Rs. ${p.price}</span>
              </div>
              <a href="provider-details.html?id=${p.id}" class="btn btn-primary-custom btn-sm">Book Service</a>
            </div>
          </div>
        </div>
      `).join('');
    }

    document.getElementById("searchInput")?.addEventListener("input", filterProviders);
    document.getElementById("categoryFilter")?.addEventListener("change", filterProviders);

    function filterProviders() {
      const searchVal = document.getElementById("searchInput").value.toLowerCase();
      const catVal = document.getElementById("categoryFilter").value;

      const filtered = allProviders.filter(p => {
        const matchesSearch = p.name.toLowerCase().includes(searchVal) || p.location.toLowerCase().includes(searchVal);
        const matchesCategory = catVal === "ALL" || p.category === catVal;
        return matchesSearch && matchesCategory;
      });

      renderGrid(filtered);
    }

    initProviders();
  </script>
</body>
</html>
