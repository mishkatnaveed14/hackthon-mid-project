<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign In / Register - QuickServe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
  <div class="card border-0 shadow-lg p-4 rounded-4" style="width: 100%; max-width: 420px;">
    <h3 class="fw-bold text-center mb-4" id="authTitle">Welcome to QuickServe</h3>
    
    <form id="authForm">
      <div class="mb-3" id="nameBox" style="display: none;">
        <label class="form-label fw-semibold">Full Name</label>
        <input type="text" id="nameInput" class="form-control">
      </div>
      <div class="mb-3" id="roleBox" style="display: none;">
        <label class="form-label fw-semibold">Select Account Role</label>
        <select id="roleInput" class="form-select">
          <option value="customer">Customer</option>
          <option value="provider">Service Provider</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Email Address</label>
        <input type="email" id="emailInput" class="form-control" required>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>
        <input type="password" id="passInput" class="form-control" required>
      </div>
      <button type="submit" id="authSubmitBtn" class="btn btn-primary-custom w-100 py-2 mb-3">Sign In</button>
    </form>

    <button id="googleBtn" class="btn btn-outline-dark w-100 mb-3">Sign In with Google</button>

    <div class="text-center">
      <a href="#" id="toggleAuth" class="text-decoration-none small text-muted">New user? Register an Account</a>
    </div>
  </div>

  <script type="module" src="app.js"></script>
  <script type="module">
    import { registerUser, loginUser, loginWithGoogle } from './firebase.js';

    let isRegister = false;

    document.getElementById("toggleAuth").addEventListener("click", (e) => {
      e.preventDefault();
      isRegister = !isRegister;
      document.getElementById("authTitle").innerText = isRegister ? "Create QuickServe Account" : "Welcome to QuickServe";
      document.getElementById("nameBox").style.display = isRegister ? "block" : "none";
      document.getElementById("roleBox").style.display = isRegister ? "block" : "none";
      document.getElementById("authSubmitBtn").innerText = isRegister ? "Register Account" : "Sign In";
      document.getElementById("toggleAuth").innerText = isRegister ? "Already registered? Sign In" : "New user? Register an Account";
    });

    document.getElementById("authForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("emailInput").value;
      const pass = document.getElementById("passInput").value;

      if (isRegister) {
        const name = document.getElementById("nameInput").value;
        const role = document.getElementById("roleInput").value;
        const res = await registerUser(email, pass, { name, role });
        alert(res.success ? res.message : res.error);
      } else {
        const res = await loginUser(email, pass);
        if (res.success) window.location.href = "index.html";
        else alert(res.error);
      }
    });

    document.getElementById("googleBtn").addEventListener("click", async () => {
      const res = await loginWithGoogle();
      if (res.success) window.location.href = "index.html";
      else alert(res.error);
    });
  </script>
</body>
</html>
